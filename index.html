  if(St=='over'){ph='over';say('Матч окончен: '+((q.sc[0]>q.sc[1]?0:1)===me.T?'победа!':'поражение'),9000);setTimeout(()=>{if(ph=='over')leave()},9000)}
  hostLogic(dt,h);
  if(me.al&&fz<=0){const f=-mv.y,r=mv.x;me.x+=(-Math.sin(yaw)*f+Math.cos(yaw)*r)*5.2*dt;me.z+=(-Math.cos(yaw)*f-Math.sin(yaw)*r)*5.2*dt;col(me,.45);me.cd-=dt;me.rl-=dt;
   if(firing&&me.cd<=0&&me.rl<=0){if(me.am<=0)reload();else{me.am--;me.cd=G[me.w].r;shoot()}}}
  pc-=dt;if(pc<=0){pc=.066;setP({x:+me.x.toFixed(2),z:+me.z.toFixed(2),y:+yaw.toFixed(2),a:me.al?1:0,w:me.w})}}
 ents(dt)}
function draw(dt){fo=Math.max(0,fo-dt*2.5);hm-=dt;$('fl').style.opacity=fo;$('xh').className=hm>0?'h':'';$('by').hidden=!(ph=='game'&&fz>0&&me.al);
 hc-=dt;if(hc>0)return;hc=.1;const h=hostP(),q=h?h.presence:{},sc=q.sc||[0,0],ms=mem(),n=k=>ms.filter(p=>p.presence.T===k&&p.presence.a==1).length,g=G[me.w],t=Math.max(0,Math.ceil(fz>0?fz:lt));

 $('bm').textContent='Закупка · $'+me.m;
 $('bt').textContent=me.al?`❤ ${Math.ceil(me.hp)}   🛡 ${me.ar|0}   ·   ${g.n} ${me.rl>0?'перезарядка':me.am+'/'+g.m}   ·   $${me.m}`:'Вы погибли — ждите конец раунда'}
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000||0);last=now;
 const s=PS().find(p=>p.sameTab);if(s)myP=s.peer;

 else{gm.visible=false;C.position.set(0,30,0);C.rotation.set(-1.25,now/7000,0)}
 R.render(S,C)}

const look=(dx,dy)=>{yaw-=dx*.006;pitch=Math.max(-1.2,Math.min(1.2,pitch-dy*.005))},pad=$('pad'),jr=$('jr'),jk=$('jk'),FB=$('fb');
pad.ontouchstart=e=>{e.preventDefault();for(const t of e.changedTouches){
 if(t.clientX<innerWidth/2&&!J){J={id:t.identifier,x:t.clientX,y:t.clientY};jr.style.cssText=`display:block;left:${J.x}px;top:${J.y}px`}
 else if(!L)L={id:t.identifier,x:t.clientX,y:t.clientY}}};

 if(J&&t.identifier==J.id){let dx=(t.clientX-J.x)/55,dy=(t.clientY-J.y)/55;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}mv.x=dx;mv.y=dy;jk.style.transform=`translate(${dx*35}px,${dy*35}px)`}
 else if(L&&t.identifier==L.id){look(t.clientX-L.x,t.clientY-L.y);L.x=t.clientX;L.y=t.clientY}}};
pad.ontouchend=pad.ontouchcancel=e=>{for(const t of e.changedTouches){
 if(J&&t.identifier==J.id){J=null;mv.x=mv.y=0;jr.style.display='none';jk.style.transform=''}
 if(L&&t.identifier==L.id)L=null}};
FB.ontouchstart=e=>{e.preventDefault();const t=e.changedTouches[0];FL={id:t.identifier,x:t.clientX,y:t.clientY};firing=1};
FB.ontouchmove=e=>{e.preventDefault();for(const t of e.changedTouches)if(FL&&t.identifier==FL.id){look(t.clientX-FL.x,t.clientY-FL.y);FL.x=t.clientX;FL.y=t.clientY}};
FB.ontouchend=FB.ontouchcancel=e=>{e.preventDefault();firing=0;FL=null};
